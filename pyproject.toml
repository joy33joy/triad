[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "triad"
version = "1.0.0"
description = "A three-AI software company in your terminal: Claude Code, Codex and Antigravity plan, build, talk and deliver together"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
triad = "triad.cli:main"

[tool.setuptools.package-data]
triad = ["skills/*.md"]

[tool.setuptools.packages.find]
include = ["triad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
